  <path d="M36.5 11.6 C43 10 50 9.4 56.8 11.2" stroke="#6e4a2f" stroke-width="0.4" opacity="0.4"/>
  <!-- Navy paint tip -->
  <path d="M54 10.8 C58 11.6 61.5 13.4 64.6 15.2 C62.5 16.4 58.5 17.2 54.8 16.4 C52.5 15.8 51.2 14.2 51.8 12.6 C52.2 11.6 53 11 54 10.8 Z" fill="#0d1b2a" opacity="0.92"/>
