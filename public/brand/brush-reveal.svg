<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 28" fill="none" aria-hidden="true">
  <!-- TEMPORARY: realistic angled paintbrush - brown bristles, navy tip only -->
  <defs>
    <linearGradient id="bristleGrad" x1="42" y1="4" x2="58" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5e3c"/>
      <stop offset="42%" stop-color="#7a5234"/>
      <stop offset="68%" stop-color="#3d3a45"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0" y1="14" x2="36" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2c2c2c"/>
    </linearGradient>
  </defs>
  <!-- Handle -->
