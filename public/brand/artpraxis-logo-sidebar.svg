<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 74" fill="none" overflow="visible" role="img" aria-label="ArtPraxis">
  <!-- Dedicated sidebar lockup (not a scaled primary).
       Wordmark ~30px � short painted stroke � full realistic brush.
       Display ~190�200px wide. Approximation pending designer export. -->
  <text
    x="2"
    y="30"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="30"
    font-weight="600"
    fill="#0d1b2a"
    letter-spacing="-0.5"
  >ArtPraxis</text>

  <!-- Short flowing stroke � painted mass, not a hairline underline -->
  <path
    d="M3 46 C22 41.5 48 39.5 78 41.2 C98 42.4 114 44.2 126 45.6
       L127.2 51.4
       C114.5 49.8 98 47.8 78 46.6 C48 44.8 22 46.4 3 50.2 Z"
    fill="#0d1b2a"
  />
  <path
    d="M8 49.2 C30 45.8 58 44.2 88 45.6 C108 46.6 120 48 126.5 49.2"
    stroke="#0d1b2a"
    stroke-width="1.6"
    stroke-linecap="round"
    opacity="0.22"
  />
  <!-- Soft upper edge of paint for depth -->
  <path
    d="M10 44.8 C36 41.8 68 40.6 98 42.4 C112 43.2 120 44.2 126 45.2"
    stroke="#0d1b2a"
    stroke-width="0.9"
    stroke-linecap="round"
    opacity="0.18"
  />

  <!-- Full brush at stroke terminus: black handle ? silver ferrule ? brown bristles ? navy tip -->
  <g transform="translate(112, 33) rotate(-16)">
    <defs>
      <linearGradient id="ap-sb-bristle" x1="22" y1="1" x2="62" y2="14" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#9a6a42"/>
        <stop offset="40%" stop-color="#8b5e3c"/>
        <stop offset="70%" stop-color="#6e4a2f"/>
        <stop offset="88%" stop-color="#3f342c"/>
        <stop offset="100%" stop-color="#0d1b2a"/>
      </linearGradient>
      <linearGradient id="ap-sb-ferrule" x1="12" y1="2" x2="24" y2="12" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#e2e5e8"/>
        <stop offset="40%" stop-color="#b0b5ba"/>
        <stop offset="100%" stop-color="#6f757b"/>
      </linearGradient>
      <linearGradient id="ap-sb-handle" x1="0" y1="4" x2="16" y2="12" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2a2a2a"/>
        <stop offset="100%" stop-color="#111111"/>
      </linearGradient>
    </defs>
    <!-- Meaningful black handle -->
    <path d="M0 8.2 L16.5 5.2 L18.2 13.2 L1.6 16 Z" fill="url(#ap-sb-handle)"/>
    <!-- Silver ferrule � fully visible -->
    <path d="M15.8 4.9 L27.5 2.6 L29.4 13.6 L17.6 15.6 Z" fill="url(#ap-sb-ferrule)"/>
    <path d="M17.4 6.4 L26.8 4.5" stroke="#f2f3f4" stroke-width="0.55" opacity="0.9"/>
    <path d="M18 11.8 L27.4 10" stroke="#5c6369" stroke-width="0.45" opacity="0.75"/>
    <path d="M16.2 10.2 L28.8 7.8" stroke="#8a9096" stroke-width="0.35" opacity="0.45"/>
    <!-- Long natural brown bristles -->
    <path
      d="M27.5 2.2
         C38.5 -0.2 52 -0.6 64 3.6
         C70.5 6 75.5 10 77.5 13.2
         C74.2 15.4 66.5 16.8 58 16.2
         C46.5 15.4 36 13.6 29.2 12.2 Z"
      fill="url(#ap-sb-bristle)"
    />
    <path d="M30 4 C42 1.2 55 1 66.5 4.8" stroke="#6e4a2f" stroke-width="0.5" opacity="0.35"/>
    <path d="M31 7.5 C44 5.2 56 5.4 68 8.8" stroke="#5a3d28" stroke-width="0.4" opacity="0.25"/>
    <!-- Navy paint only on lower tip / wet edge -->
    <path
      d="M58 5.2
         C66 7 72.5 10.2 76.5 13.2
         C73.5 15 67 16.2 61 15.4
         C56.5 14.8 54.8 10.2 56.2 7.6
         C56.7 6.4 57.3 5.6 58 5.2 Z"
      fill="#0d1b2a"
      opacity="0.96"
    />
  </g>
</svg>
