# PROPOSAL ONLY. This file is not the live App Hosting target.
# firebase.json still deploys apphosting.yaml to backend "artpraxis" on artpraxis-33840.
# Do not deploy this file, and do not copy production API keys or the production OpenAI secret into it.
#
# Intended isolated target, after explicit approval:
#   Firebase project: artpraxis-staging-33840
#   App Hosting backend: artpraxis-staging
# Fill NEXT_PUBLIC_FIREBASE_API_KEY, APP_ID, and MESSAGING_SENDER_ID from that
# staging web app only. Leave OPENAI_API_KEY empty until a staging-only secret exists.
# Paid image generation stays off and daily quotas stay at zero.

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 40
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: ""
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: artpraxis-staging-33840.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: artpraxis-staging-33840
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: artpraxis-staging-33840.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: ""
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: ""
  - variable: OPENAI_API_KEY
    value: ""
    availability:
      - RUNTIME
  - variable: OPENAI_MODEL
    value: gpt-5-mini
  - variable: ENABLE_STAGE_IMAGE_GEN
    value: "false"
  - variable: NEXT_PUBLIC_ENABLE_AI_STAGE_REFINEMENT
    value: "false"
  - variable: ENABLE_AI_STAGE_REFINEMENT
    value: "false"
  - variable: STAGE_GEN_MAX_RETRIES
    value: "0"
  - variable: GEN_QUOTA_STORE
    value: firestore
    availability:
      - RUNTIME
  - variable: GEN_QUOTA_TUTORIALS_PER_DAY
    value: "0"
    availability:
      - RUNTIME
  - variable: GEN_QUOTA_IMAGES_PER_DAY
    value: "0"
    availability:
      - RUNTIME
  - variable: GEN_QUOTA_MAX_CONCURRENT
    value: "0"
    availability:
      - RUNTIME
